[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend service with Google ADK"
readme = "README.md"
authors = [
    { name = "Aswath S", email = "aswath7862001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.7.1",
    "google-cloud-firestore>=2.29.0",
    "google-cloud-vectorsearch>=0.11.0",
    "google-genai>=2.19.0",
    "httpx>=0.28.1",
    "pillow>=10.4.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=13.9.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
